[project]
name = "grasp"
version = "0.1.0"
description = "GRASP: Group-Relative Agentic policy for Structured retrieval and knowledge integration in RAG Proxies"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.7",            # Blackwell (RTX 50xx) cần build CUDA 12.8+ (xem [tool.uv.sources])
  "transformers>=4.51",
  "peft>=0.14",
  "trl>=0.15",             # GRPOTrainer / PPOTrainer
  "accelerate>=1.4",
  "bitsandbytes>=0.45",
  "sentence-transformers>=3.4",
  "faiss-cpu>=1.9",
  "datasets>=3.3",
  "huggingface-hub>=0.28",
  "ijson>=3.3",            # stream file JSON lớn của 2WikiMultihopQA khi dựng corpus
  "numpy>=1.26",
  "httpx>=0.27",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "openai>=1.68",          # client cho vLLM server & API ngoài
  "wandb>=0.19",
  "rich>=13.9",
  "tqdm>=4.67",
  "pydantic>=2.10",
]

[project.optional-dependencies]
serve = ["vllm>=0.8"]
dev = ["pytest>=8.3", "ruff>=0.9", "pre-commit>=4.1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grasp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # độ dài code do `ruff format` lo; comment/docstring tiếng Việt được phép dài hơn

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
